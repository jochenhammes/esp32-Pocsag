[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Displaytyp (Standard: SSD1306 128x32). Alternativen als Build-Flag:
;   -DDISPLAY_SSD1306_128X64   oder   -DDISPLAY_SH1106_128X64
upload_speed = 460800
lib_deps =
    jgromes/RadioLib@^7.1.0
    olikraus/U8g2@^2.35.30

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
